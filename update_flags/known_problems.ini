; Problems found by testing on a SuperStation One, which the automatic check can't see (it compares
; files, not how a driver behaves). Read by .github/scripts/cm_safety.py: a section can only RAISE that
; verdict (level = warning | unsafe), never lower it, and its "- " lines are added to the alert.
;   [linux 260912]   one MiSTer Linux release (its version, as in Update All)
;   [linux]          every MiSTer Linux release
;   [cores]          the cores alert
; Take a section out when it's fixed: the check runs again on the next hour.

[linux 260912]
level = unsafe
- SD card: games can stutter or load very slowly on slower SD cards (the card read time limit is too short on 6.18)
- exFAT: big game folders open slower than before
- USB: while the NVMe drive is busy, controllers behind a hub can register phantom button presses
- Xbox-style controllers may not be detected after switching on
- DualShock 4: Options acts as the Guide button
- Some Bluetooth and WiFi adapters still lack drivers or firmware
