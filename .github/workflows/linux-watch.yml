# Checks MiSTer's main distribution for a new Linux image every 6 hours. When one appears it
# opens an issue (which emails f3bandit) with what changed. It never changes update_flags.
name: Watch MiSTer Linux updates

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: linux-flag
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for a new MiSTer Linux image
        id: watch
        run: python3 .github/scripts/linux_watch.py
      - name: Save the watch state
        run: |
          git add update_flags/linux_watch.ini
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Linux watch: last seen MiSTer Linux $(grep '^version' update_flags/linux_watch.ini | cut -d' ' -f3)"
            git push
          fi
      - name: Email the report (GitHub issue)
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.watch.outputs.version }}
        run: |
          gh label create linux-update --color d93f0b --description "New MiSTer Linux image to review" --force
          gh issue create --title "MiSTer Linux $VERSION is out: review for the SS1" \
            --label linux-update --assignee "${{ github.repository_owner }}" --body-file .linux_watch_issue.md
