name: Bug report
description: Something in SS1 Tool or the SS1 scripts isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The fastest way to get help is to attach a **Debug Report**:
        open SS1 Tool → **Debug Report** → **Create debug report**, save the file and drag it into the box below.
        Passwords, keys, WiFi names and MAC addresses are already redacted.
  - type: input
    id: version
    attributes:
      label: SS1 Tool version
      description: Shown in the bottom right corner of the app.
      placeholder: v1.6.2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the tool?
      options:
        - Connect / saved devices
        - Setup (scripts, Samba, Update All, scraper logins)
        - Remote (controller / keyboard / reboot / shutdown)
        - Files
        - MiSTer Settings (ini editor / HDMI fix / backups)
        - SD Diagnostics
        - Debug Report
        - Flash SD Card
        - SS1 scripts on their own (sd_integrity / shutdown / debug report)
        - Other
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - SuperStation One
        - Other MiSTer
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error message shown in the app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Debug report and screenshots
      description: Drag the SS1_debug_report_*.txt file and any screenshots here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I'm using the latest release of SS1 Tool.
          required: true
        - label: I searched existing issues and this hasn't been reported.
          required: true
