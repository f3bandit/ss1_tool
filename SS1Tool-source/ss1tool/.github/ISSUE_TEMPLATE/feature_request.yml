name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! The more detail you give, the easier it is to build.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the tool?
      options:
        - Connect / saved devices
        - Setup
        - Remote
        - Files
        - MiSTer Settings
        - SD Diagnostics
        - Debug Report
        - Flash SD Card
        - SS1 scripts
        - Something new
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the feature you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, mockups or links to similar tools are welcome.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been requested.
          required: true
